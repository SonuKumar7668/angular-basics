<div class="cr">
    <h2>Get and Set Input field value</h2>
    <p>Username is: {{name}}</p>
    <h1>Name: {{displayName}}</h1>
    <input type="text" value="{{name}}" (input)="getName($event)" placeholder="Enter your name">
    <br>
    <br>
    <button (click)="showName($event)">Show name</button>
    <button (click)="setName($event)">Set name</button>

    <br>
    <br>
    <p>{{email}}</p>
    <input type="email" placeholder="Enter email" #emailField>
    <button (click)="showEmail(emailField.value)">show mail</button>
</div>
